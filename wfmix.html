<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfmix</title>
<meta name="wfmix-token" content="__WFMIX_TOKEN__">
<style>
:root{
  --bg:#0f1216; --panel:#161a20; --panel2:#1c2129; --line:#2a313b; --text:#e6e9ee; --mute:#8b95a3;
  --acc:#3fc1b0; --acc2:#2a8f83; --warn:#e7b84a; --err:#ef6b6b; --ok:#6fcf7f; --cmd:#8fb4ff;
  --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc2)}
button.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
button.pri:hover{background:var(--acc)}
button.ghost{background:transparent}
button.sm{padding:2px 7px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 6px 0 0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--acc)}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#2f5a37}.chip.bad{color:var(--err);border-color:#5a2f2f}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:2px 9px;font-size:12px;color:var(--mute)}
.seg button.on{background:var(--acc2);color:#fff}
.sp{flex:1}
main{flex:1;display:grid;grid-template-columns:270px minmax(320px,1fr) minmax(330px,1fr);min-height:0}
section{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
section:last-child{border-right:0}
.sh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:0;font-weight:600}
.scroll{overflow:auto;flex:1;min-height:0}
.faces .f{display:flex;gap:10px;align-items:center;padding:6px 12px;cursor:pointer;border-bottom:1px solid #1d222a}
.faces .f:hover{background:var(--panel)}
.faces .f.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
.faces img,.noimg{width:38px;height:38px;border-radius:50%;background:#000;object-fit:cover;flex:none}
.noimg{display:grid;place-items:center;color:var(--mute);font-size:11px;border:1px dashed var(--line)}
.faces .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faces .c{font-size:11px;color:var(--mute)}
.tabs{display:flex;gap:4px}
.tabs button{border-radius:99px;padding:2px 10px;font-size:12px}
.tabs button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.fhead{display:flex;gap:14px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.fhead img,.fhead .noimg{width:96px;height:96px}
.fhead h3{margin:0 0 6px;font-size:16px;word-break:break-all}
.fhead .btns{display:flex;gap:6px;flex-wrap:wrap}
.blk{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #1d222a;cursor:pointer}
.blk:hover{background:var(--panel)}
.blk.sel{background:var(--panel2)}
.blk .lbl{flex:1;min-width:0}
.blk .lbl b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .meta{font-size:11px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:0 6px;border-radius:4px;background:#232a33;color:var(--mute)}
.tag.h{background:#2c2a1b;color:var(--warn)}
.tag.d{background:#1b2a2c;color:var(--acc)}
.tag.e{background:#2a1f2c;color:#d9a3ff}
.tag.q{background:#2c1f1f;color:var(--err)}
.add{width:28px;height:28px;padding:0;border-radius:50%;font-size:17px;line-height:1;flex:none}
.mine .row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid #1d222a;cursor:pointer}
.mine .row:hover{background:var(--panel)}
.mine .row.sel{background:var(--panel2)}
.mine .row.drag{opacity:.4}
.mine .row.over{box-shadow:inset 0 2px 0 var(--acc)}
.mine .grip{cursor:grab;color:var(--mute);user-select:none;padding:0 2px}
.mine .src{font-size:11px;color:var(--mute)}
.mine .acts{display:flex;gap:3px}
.form{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.form label{color:var(--mute);font-size:12px}
.actions{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;background:var(--panel)}
.hint{font-size:12px;color:var(--mute);padding:8px 12px}
.empty{color:var(--mute);padding:24px 16px;text-align:center;font-size:13px}
.bottom{height:34vh;min-height:170px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.bottom .sh{border-bottom:1px solid var(--line)}
textarea{flex:1;width:100%;resize:none;border:0;background:#0b0d10;color:#d6dde6;font:12.5px/1.45 var(--mono);padding:10px 12px;tab-size:4;white-space:pre}
#log{flex:1;overflow:auto;background:#0b0d10;font:12px/1.45 var(--mono);padding:8px 12px;white-space:pre-wrap}
#log .head{color:var(--acc);font-weight:600}
#log .err{color:var(--err)}#log .warn{color:#e3c27a}#log .ok{color:var(--ok)}#log .cmd{color:var(--cmd)}#log .info{color:#c6cdd6}
.badge{background:var(--err);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:4px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--acc2);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.resz{height:5px;cursor:ns-resize;background:transparent;margin-top:-3px}
@media (max-width: 1000px){ main{grid-template-columns:1fr} section{border-right:0;border-bottom:1px solid var(--line);max-height:60vh} }
</style>
</head>
<body>
<header>
  <h1><span>wf</span>mix · <span data-t="Watchface construction kit" style="color:inherit"></span></h1>
  <span id="chipRepo" class="chip"></span>
  <span id="chipT5" class="chip"></span>
  <span id="chipT6" class="chip"></span>
  <div class="sp"></div>
  <label class="chip" style="display:flex;gap:6px;align-items:center;border:0"><span data-t="Watch"></span>
    <input id="host" style="width:130px;padding:2px 6px" data-tt="Watch IP (Developer mode)">
  </label>
  <button class="sm" id="btnInfo" data-t="Check connection" data-tt="ssh root@IP – query version and Qt of the watch"></button>
  <div class="seg" id="langSeg"></div>
</header>

<main>
  <!-- Spalte 1: Watchfaces -->
  <section>
    <div class="sh">
      <input id="q" data-tp="Search watchface …" style="flex:1;min-width:0">
    </div>
    <div class="sh" style="padding-top:6px;padding-bottom:6px">
      <div class="tabs" id="ftabs">
        <button data-f="all" class="on" data-t="All"></button>
        <button data-f="analog" data-t="Analog"></button>
        <button data-f="digital" data-t="Digital"></button>
        <button data-f="own" data-t="Own"></button>
      </div>
    </div>
    <div class="scroll faces" id="faces"></div>
  </section>

  <!-- Spalte 2: Bausteine -->
  <section>
    <div id="fhead" class="fhead"><div class="empty" style="padding:0" data-t="Pick a watchface on the left."></div></div>
    <div class="sh"><h2 data-t="Building blocks"></h2><div class="sp"></div>
      <span class="hint" style="padding:0" data-t="Click = view code · ＋ = add"></span></div>
    <div class="scroll" id="blocks"></div>
  </section>

  <!-- Spalte 3: Mein Watchface -->
  <section class="mine">
    <div class="sh"><h2 data-t="My watchface"></h2><div class="sp"></div>
      <select id="projects" data-tt="Load saved project"></select>
      <button class="sm ghost" id="btnNew" data-t="New" data-tt="Start over"></button>
    </div>
    <div class="form">
      <label for="name" data-t="Name"></label>
      <input id="name" data-tp="e.g. my-commander" spellcheck="false">
      <label for="base" data-t="Base"></label>
      <select id="base" data-tt="Provides root type, base settings and preview image"></select>
      <label for="target" data-t="Target"></label>
      <select id="target" data-tt="Which AsteroidOS version the watchface is generated for">
        <option value="5"></option>
        <option value="6"></option>
      </select>
    </div>
    <div class="hint" data-th="Order = drawing order: further down is drawn on top (unless &lt;code&gt;z&lt;/code&gt; is set). Drag to reorder."></div>
    <div class="scroll" id="mine"></div>
    <div class="actions">
      <button class="pri" id="btnTest" data-t="▶ Test on PC" data-tt="Generate and open in the test window"></button>
      <button id="btnStop" data-tt="Close test window">■</button>
      <button id="btnBuild" data-t="Generate" data-tt="Only generate the files"></button>
      <button id="btnDeploy" data-t="⇪ To the watch" data-tt="Generate, copy to the watch via SSH and activate"></button>
      <div class="sp"></div>
      <button class="ghost sm" id="btnOpen" data-t="Open QML" data-tt="Open the generated QML file in an editor"></button>
      <button class="ghost sm" id="btnUndeploy" data-t="Remove from watch" data-tt="Delete the watchface from the watch"></button>
    </div>
  </section>
</main>

<div class="resz" id="resz"></div>
<div class="bottom" id="bottom">
  <div class="sh" style="padding:6px 12px">
    <div class="tabs" id="btabs">
      <button data-tab="code" class="on" data-t="Code"></button>
      <button data-tab="result" data-t="Result QML"></button>
      <button data-tab="log"><span data-t="Log"></span><span id="errBadge"></span></button>
    </div>
    <span id="codeInfo" class="hint" style="padding:0 6px"></span>
    <div class="sp"></div>
    <span id="codeBtns" style="display:flex;gap:6px"></span>
    <button class="sm ghost" id="btnClearLog" style="display:none" data-t="Clear log"></button>
  </div>
  <textarea id="code" spellcheck="false" readonly></textarea>
  <div id="log" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ---------------------------------------------------------------- Texte / strings
// Texte: englischer Quelltext, Uebersetzungen kommen aus dem gettext-Katalog
// (locale/<lang>/LC_MESSAGES/wfmix.po), geliefert ueber /api/i18n
let CATALOG = {};
const LS = {
  get(k, d){ try { const v = localStorage.getItem("wfmix." + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("wfmix." + k, JSON.stringify(v)); } catch(e){} }
};
let LANG = "en";
// T('English text {0}', x): Uebersetzung aus dem Katalog, Platzhalter {0}, {1} …
function T(k, ...a){ let s = CATALOG[k] || k; a.forEach((v, i) => { s = s.split("{" + i + "}").join(v); }); return s; }
async function loadCatalog(l){ try { CATALOG = l === "en" ? {} : await api("/api/i18n?lang=" + encodeURIComponent(l)); } catch(e){ CATALOG = {}; } }

const $ = s => document.querySelector(s);
const TOKEN = (document.querySelector('meta[name="wfmix-token"]') || {}).content || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = { faces: [], filter: "all", q: "", face: null, faceCache: {}, sel: null,
          proj: LS.get("proj", {name: "", base: "", target: "", items: []}), mineSel: -1,
          tab: "code", logN: 0, errs: 0, st: null };

async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method: "POST",
    headers: {"Content-Type": "application/json", "X-Wfmix-Token": TOKEN}, body: JSON.stringify(body)});
  const ct = r.headers.get("Content-Type") || "";
  const d = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((d && d.error) || ("HTTP " + r.status));
  return d;
}
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2600); }
function save(){ LS.set("proj", S.proj); }

// ---------------------------------------------------------------- Sprache
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll("[data-th]").forEach(e => { e.innerHTML = T(e.dataset.th); });
  document.querySelectorAll("[data-tt]").forEach(e => { e.title = T(e.dataset.tt); });
  document.querySelectorAll("[data-tp]").forEach(e => { e.placeholder = T(e.dataset.tp); });
  $("#target").options[0].textContent = T("Qt5 – AsteroidOS ≤ 2.1"); $("#target").options[1].textContent = T("Qt6 – AsteroidOS ≥ 2.2");
  if (S.st) $("#langSeg").innerHTML = S.st.languages.map(l => `<button data-l="${esc(l.code)}">${esc(l.name)}</button>`).join("");
  [...$("#langSeg").children].forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  renderChips(); renderProjects(); renderFaces(); renderMine(); if (S.face) renderFace();
  if (S.tab === "code" && codeState.info) showCode(codeState.txt, codeState.infoFn ? codeState.infoFn() : codeState.info, codeState.ed, codeState.infoFn);
  if (S.tab === "result") showResult();
}
$("#langSeg").onclick = async e => { const b = e.target.closest("button"); if (!b) return;
  LANG = b.dataset.l; LS.set("lang", LANG); try { await api("/api/lang", {lang: LANG}); } catch(err){}
  await loadCatalog(LANG); applyLang(); };

// ---------------------------------------------------------------- Start
async function init(){
  let st = await api("/api/state");
  const codes = st.languages.map(l => l.code);
  const nav = (navigator.language || "en").toLowerCase().split("-")[0];
  LANG = [LS.get("lang", null), nav, st.lang, "en"].find(c => c && codes.includes(c));
  if (LANG !== st.lang) { try { await api("/api/lang", {lang: LANG}); } catch(e){} st = await api("/api/state"); }
  await loadCatalog(LANG);
  S.st = st; S.faces = st.faces;
  if (!S.proj.target) S.proj.target = st.repoQt;
  $("#host").value = LS.get("host", st.host);
  applyLang();
  const last = LS.get("face", null);
  if (last && S.faces.find(f => f.id === last)) selectFace(last);
}
function renderChips(){
  const st = S.st; if (!st) return;
  const r = $("#chipRepo"); r.textContent = T("Repo: Qt{0}", st.repoQt); r.title = T("Checked-out state of unofficial-watchfaces") + ": " + st.repo;
  ["5", "6"].forEach(q => { const c = $("#chipT" + q); const ok = st.testers[q];
    c.textContent = T("Test Qt{0}", q) + (ok ? " ✓" : " ✗"); c.className = "chip " + (ok ? "ok" : "bad");
    c.title = ok ? T("Testing on the PC with Qt{0} is available", q) : T("Packages for testing with Qt{0} are missing (see instructions)", q); });
}
function renderProjects(){
  if (!S.st) return;
  $("#projects").innerHTML = `<option value="">${esc(T("Load project …"))}</option>` + S.st.projects.map(p => `<option>${esc(p)}</option>`).join("");
}

// ---------------------------------------------------------------- Watchface-Liste
function kindOf(f){ return f.id.startsWith("analog") ? "analog" : (f.id.startsWith("digital") || f.id.startsWith("binary")) ? "digital" : "other"; }
function renderFaces(){
  const q = S.q.toLowerCase();
  const repoQt = S.st ? S.st.repoQt : "";
  const list = S.faces.filter(f => (!q || f.id.toLowerCase().includes(q))
     && (S.filter === "all" || (S.filter === "own" ? f.own : (!f.own && kindOf(f) === S.filter))));
  $("#faces").innerHTML = list.map(f => `
    <div class="f ${S.face && S.face.id === f.id ? "sel" : ""}" data-id="${esc(f.id)}">
      <img loading="lazy" src="/api/thumb?id=${encodeURIComponent(f.id)}" onerror="this.outerHTML='<div class=noimg>?</div>'">
      <div style="min-width:0"><div class="n">${esc(f.id)}</div>
      <div class="c">${esc(T("{0} blocks", f.blocks))}${f.own ? " · " + esc(T("own")) + " · Qt" + esc(f.qt) : ""}${f.rootType !== "Item" ? " · " + esc(f.rootType) : ""}</div></div>
    </div>`).join("") || '<div class="empty">–</div>';
}
$("#faces").onclick = e => { const el = e.target.closest(".f"); if (el) selectFace(el.dataset.id); };
$("#q").oninput = e => { S.q = e.target.value; renderFaces(); };
$("#ftabs").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  S.filter = b.dataset.f; [...$("#ftabs").children].forEach(x => x.classList.toggle("on", x === b)); renderFaces(); };

async function loadFace(id){
  if (!S.faceCache[id]) S.faceCache[id] = await api("/api/face?id=" + encodeURIComponent(id));
  return S.faceCache[id];
}
async function selectFace(id){
  try { S.face = await loadFace(id); } catch(e){ toast(e.message); return; }
  LS.set("face", id); S.sel = null;
  renderFaces(); renderFace();
}
function inMine(fid, key){ return S.proj.items.some(i => i.face === fid && i.key === key); }

function renderFace(){
  const f = S.face;
  $("#fhead").innerHTML = `
    <img src="/api/thumb?id=${encodeURIComponent(f.id)}" onerror="this.outerHTML='<div class=noimg>${esc(T("no image"))}</div>'">
    <div style="min-width:0">
      <h3>${esc(f.id)} <span class="tag">Qt${esc(f.qt)}</span></h3>
      <div class="btns">
        <button class="sm" id="bAll" title="${esc(T("Add all blocks (e.g. to edit a watchface and delete parts)"))}">${esc(T("Add all"))}</button>
        <button class="sm" id="bBase" title="${esc(T("Use this watchface as base"))}">${esc(T("Use as base"))}</button>
        <button class="sm ghost" id="bOrig" title="${esc(T("Open the original in the test window"))}">${esc(T("Test original"))}</button>
        <button class="sm ghost" id="bSrc">${esc(T("Full code"))}</button>
      </div>
    </div>`;
  $("#bAll").onclick = () => { addAll(f); };
  $("#bBase").onclick = () => { S.proj.base = f.id; save(); renderMine(); toast(T("Base: {0}", f.id)); };
  $("#bOrig").onclick = () => runTest({face: f.id});
  $("#bSrc").onclick = async () => { showCode(await api("/api/source?id=" + encodeURIComponent(f.id)), f.id + T(" (complete)"), null); };
  const extra = [];
  if (f.props.length) extra.push(T("{0} root properties", f.props.length));
  if (f.handlers.length) extra.push(T("Handlers: {0}", f.handlers.map(h => h.name).join(", ")));
  $("#blocks").innerHTML = (f.blockList.map(b => `
    <div class="blk ${S.sel && S.sel.key === b.key ? "sel" : ""}" data-k="${esc(b.key)}">
      <button class="add" title="${esc(inMine(f.id, b.key) ? T("already added – click to remove it") : T("add"))}">${inMine(f.id, b.key) ? "✓" : "＋"}</button>
      <div class="lbl"><b>${esc(b.label)}</b>
        <div class="meta"><span class="tag">${esc(b.type)}</span><span>${esc(T("{0} lines", b.lines))}</span>
        ${b.only ? `<span class="tag q" title="${esc(T("Only works on Qt{0}. For the other target wfmix adapts or removes the effect.", b.only))}">${esc(T("Qt{0} only", b.only))}</span>` : ""}
        ${b.helper ? `<span class="tag h" title="${esc(T("Draws nothing, provides data or controls other blocks"))}">${esc(T("Helper"))}</span>` : ""}
        ${b.deps.length ? `<span class="tag d" title="${esc(T("Added automatically"))}">${esc(T("needs: {0}", b.deps.join(", ")))}</span>` : ""}
        ${b.uses.length ? `<span class="tag e" title="${esc(T("Root properties/functions that come along automatically"))}">${esc(T("uses: {0}", b.uses.join(", ")))}</span>` : ""}
        </div></div>
    </div>`).join("") || `<div class="empty">${esc(T("This watchface has no blocks of its own (it is built on a component). It can still be used as base."))}</div>`)
    + (extra.length ? `<div class="hint">${esc(T("Added automatically when needed: {0}", extra.join(" · ")))}</div>` : "");
}
$("#blocks").onclick = e => {
  const row = e.target.closest(".blk"); if (!row) return;
  const b = S.face.blockList.find(x => x.key === row.dataset.k);
  if (e.target.closest(".add")) { addItem(S.face, b); return; }
  S.sel = b; renderFace();
  showCode(b.code, `${S.face.id} › ${b.label}`, null);
};

// ---------------------------------------------------------------- Mein Watchface
function defaultName(f){ return T("my-") + f.qml.replace(/^(analog|digital)-/, ""); }
function addItem(f, b){
  const idx = S.proj.items.findIndex(i => i.face === f.id && i.key === b.key);
  if (idx >= 0) { S.proj.items.splice(idx, 1); S.mineSel = -1; save(); renderMine(); renderFace(); toast("✕ " + b.label); return; }
  if (!S.proj.items.length && !S.proj.base) S.proj.base = f.id;
  if (!S.proj.name) S.proj.name = defaultName(f);
  S.proj.items.push({face: f.id, key: b.key, label: b.label, type: b.type});
  save(); renderMine(); renderFace();
  toast("＋ " + b.label);
}
function addAll(f){
  if (S.proj.items.length && !confirm(T("Add all blocks of {0}?", f.id))) return;
  if (!S.proj.items.length) { S.proj.base = f.id; if (!S.proj.name) S.proj.name = defaultName(f); }
  f.blockList.forEach(b => { if (!inMine(f.id, b.key)) S.proj.items.push({face: f.id, key: b.key, label: b.label, type: b.type}); });
  save(); renderMine(); renderFace();
}
function renderMine(){
  $("#name").value = S.proj.name || "";
  $("#target").value = S.proj.target || (S.st ? S.st.repoQt : "5");
  const used = [...new Set([S.proj.base, ...S.proj.items.map(i => i.face)].filter(Boolean))];
  $("#base").innerHTML = used.map(u => `<option ${u === S.proj.base ? "selected" : ""}>${esc(u)}</option>`).join("") || "<option value=''>–</option>";
  $("#mine").innerHTML = S.proj.items.map((it, i) => `
    <div class="row ${i === S.mineSel ? "sel" : ""}" draggable="true" data-i="${i}">
      <span class="grip" title="${esc(T("drag"))}">⋮⋮</span>
      <div style="flex:1;min-width:0">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.label || it.key)} ${it.code ? `<span class="tag e">${esc(T("edited"))}</span>` : ""}</div>
        <div class="src">${esc(it.face)} · ${esc(it.type || "")}</div>
      </div>
      <div class="acts">
        <button class="sm ghost" data-a="up" title="${esc(T("move up (further back)"))}">↑</button>
        <button class="sm ghost" data-a="down" title="${esc(T("move down (further front)"))}">↓</button>
        <button class="sm ghost" data-a="del" title="${esc(T("remove"))}">✕</button>
      </div>
    </div>`).join("") || `<div class="empty">${T("Still empty.<br>Pick a watchface on the left and add blocks with ＋ –<br>or “Add all” and then delete what you don't want with ✕.")}</div>`;
}
$("#name").oninput = e => { S.proj.name = e.target.value; save(); };
$("#name").onchange = e => { S.proj.name = e.target.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, ""); save(); renderMine(); };
$("#base").onchange = e => { S.proj.base = e.target.value; save(); };
$("#target").onchange = e => { S.proj.target = e.target.value; save(); if (S.tab === "result") showResult(); };
$("#btnNew").onclick = () => { if (S.proj.items.length && !confirm(T("Discard current watchface? (Already generated files are kept.)"))) return;
  S.proj = {name: "", base: "", target: S.proj.target || (S.st ? S.st.repoQt : "5"), items: []}; S.mineSel = -1; save(); renderMine(); if (S.face) renderFace(); };
$("#projects").onchange = async e => {
  const n = e.target.value; e.target.value = ""; if (!n) return;
  try { const p = await api("/api/project?name=" + encodeURIComponent(n)); S.proj = p; if (!S.proj.target) S.proj.target = S.st.repoQt;
    S.mineSel = -1; save(); renderMine(); if (S.face) renderFace(); toast(T("Loaded: {0}", n)); }
  catch(err){ toast(err.message); }
};
$("#mine").onclick = async e => {
  const row = e.target.closest(".row"); if (!row) return;
  const i = +row.dataset.i, a = e.target.closest("button") && e.target.closest("button").dataset.a;
  const it = S.proj.items;
  if (a === "del") { it.splice(i, 1); S.mineSel = -1; }
  else if (a === "up" && i > 0) { [it[i-1], it[i]] = [it[i], it[i-1]]; S.mineSel = i - 1; }
  else if (a === "down" && i < it.length - 1) { [it[i+1], it[i]] = [it[i], it[i+1]]; S.mineSel = i + 1; }
  else if (!a) { S.mineSel = i; await editItem(i); }
  save(); renderMine(); if (S.face) renderFace();
};
let dragI = -1;
$("#mine").addEventListener("dragstart", e => { const r = e.target.closest(".row"); if (!r) return; dragI = +r.dataset.i; r.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
$("#mine").addEventListener("dragend", () => { dragI = -1; document.querySelectorAll(".row").forEach(r => r.classList.remove("drag", "over")); });
$("#mine").addEventListener("dragover", e => { const r = e.target.closest(".row"); if (!r || dragI < 0) return; e.preventDefault();
  document.querySelectorAll(".row.over").forEach(x => x.classList.remove("over")); r.classList.add("over"); });
$("#mine").addEventListener("drop", e => { const r = e.target.closest(".row"); if (!r || dragI < 0) return; e.preventDefault();
  const to = +r.dataset.i; const [m] = S.proj.items.splice(dragI, 1); S.proj.items.splice(to, 0, m); S.mineSel = to; save(); renderMine(); });

async function editItem(i){
  const it = S.proj.items[i];
  let f; try { f = await loadFace(it.face); } catch(e){ toast(e.message); return; }
  const b = f.blockList.find(x => x.key === it.key);
  const orig = b ? b.code : "";
  const infoFn = () => T("Editing: {0}  ({1})", it.label || it.key, it.face);
  const ed = {
    save(txt){ it.code = (txt.trim() === orig.trim()) ? undefined : txt; if (!it.code) delete it.code; save(); renderMine(); toast(it.code ? T("Change saved") : T("Unchanged")); },
    reset(){ delete it.code; save(); renderMine(); showCode(orig, infoFn(), ed, infoFn); toast(T("Original restored")); }
  };
  showCode(it.code || orig, infoFn(), ed, infoFn);
}

// ---------------------------------------------------------------- Unterer Bereich
function setTab(t){
  S.tab = t;
  [...$("#btabs").children].forEach(x => x.classList.toggle("on", x.dataset.tab === t));
  $("#code").style.display = t === "log" ? "none" : "";
  $("#log").style.display = t === "log" ? "" : "none";
  $("#btnClearLog").style.display = t === "log" ? "" : "none";
  $("#codeInfo").style.display = $("#codeBtns").style.display = t === "code" ? "" : "none";
  if (t === "log") { S.errs = 0; $("#errBadge").innerHTML = ""; const l = $("#log"); l.scrollTop = l.scrollHeight; }
  if (t === "result") showResult();
  if (t === "code" && codeState.info) { $("#code").value = codeState.txt; $("#code").readOnly = !codeState.ed; }
}
$("#btabs").onclick = e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); };
let codeState = {txt: "", info: "", ed: null, infoFn: null};
function showCode(txt, info, editor, infoFn){
  codeState = {txt, info, ed: editor, infoFn: infoFn || null};
  if (S.tab !== "code") setTab("code");
  const c = $("#code");
  c.value = txt; c.readOnly = !editor; c.scrollTop = 0;
  $("#codeInfo").textContent = info + (editor ? "" : T("  (view only)"));
  $("#codeBtns").innerHTML = editor ? `<button class="sm pri" id="cSave">${esc(T("Apply"))}</button><button class="sm" id="cReset">${esc(T("Original"))}</button>` : "";
  if (editor) { $("#cSave").onclick = () => { codeState.txt = $("#code").value; editor.save($("#code").value); }; $("#cReset").onclick = () => editor.reset(); }
}
$("#code").addEventListener("input", e => { if (S.tab === "code" && codeState.ed) codeState.txt = e.target.value; });
$("#code").addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.target.readOnly) { e.preventDefault(); const t = e.target, s = t.selectionStart;
    t.setRangeText("    ", s, t.selectionEnd, "end"); }
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && codeState.ed && S.tab === "code") { e.preventDefault(); codeState.ed.save($("#code").value); }
});
async function showResult(){
  const c = $("#code"); c.readOnly = true;
  if (!S.proj.items.length) { c.value = T("// No blocks selected yet."); return; }
  try { const r = await api("/api/preview", {project: S.proj});
    c.value = r.qml + (r.log.length ? "\n/* " + T("Notes from building:") + "\n" + r.log.map(l => " * " + l).join("\n") + "\n */\n" : ""); }
  catch(e){ c.value = T("// Error: ") + e.message; }
}

async function pollLog(){
  try {
    const lines = await api("/api/log?since=" + S.logN);
    if (lines.length) {
      const l = $("#log"); const atEnd = l.scrollHeight - l.scrollTop - l.clientHeight < 40;
      const frag = document.createDocumentFragment();
      lines.forEach(x => { const d = document.createElement("div"); d.className = x.k; d.textContent = x.t; frag.appendChild(d);
        if (x.k === "err") S.errs++; S.logN = x.n;
        const m = /Qt([56])\D+Qt\1/.exec(x.t); if (x.k === "ok" && m && !x.t.includes("✓")) watchQt(m[1]); });
      l.appendChild(frag); if (atEnd) l.scrollTop = l.scrollHeight;
      if (S.tab !== "log" && S.errs) $("#errBadge").innerHTML = `<span class="badge">${S.errs}</span>`;
    }
  } catch(e){}
  setTimeout(pollLog, 800);
}
function watchQt(q){ if (S.proj.target !== q) { S.proj.target = q; save(); renderMine(); toast(T("The watch uses Qt{0} – target set to Qt{0}.", q)); } }
$("#btnClearLog").onclick = () => { $("#log").innerHTML = ""; };

// ---------------------------------------------------------------- Aktionen
function needProj(){
  if (!S.proj.items.length) { toast(T("Add some blocks first")); return false; }
  if (!S.proj.name) { toast(T("Please enter a name")); $("#name").focus(); return false; }
  return true;
}
async function runTest(opt){
  setTab("log");
  try {
    if (opt && opt.face) await api("/api/test", {face: opt.face});
    else { if (!needProj()) return; await api("/api/test", {project: S.proj}); refreshOwn(); }
  } catch(e){ toast(e.message); }
}
$("#btnTest").onclick = () => runTest();
$("#btnStop").onclick = () => api("/api/stop", {});
$("#btnBuild").onclick = async () => { if (!needProj()) return; setTab("log");
  try { const r = await api("/api/build", {project: S.proj}); toast(T("Generated: {0}", r.name)); refreshOwn(); } catch(e){ toast(e.message); } };
$("#btnDeploy").onclick = async () => { if (!needProj()) return;
  if (!confirm(T("Copy “{0}” to the watch ({1}) and activate it?\nThe watch UI restarts briefly.", S.proj.name, $("#host").value))) return;
  setTab("log"); try { await api("/api/deploy", {project: S.proj, host: $("#host").value, restart: true}); } catch(e){ toast(e.message); } };
$("#btnUndeploy").onclick = async () => { if (!S.proj.name) return;
  if (!confirm(T("Delete “{0}” from the watch?", S.proj.name))) return;
  setTab("log"); await api("/api/undeploy", {name: S.proj.name, host: $("#host").value}); };
$("#btnOpen").onclick = async () => { if (!S.proj.name) return; const r = await api("/api/open", {name: S.proj.name}); toast(r.path); };
$("#btnInfo").onclick = async () => { setTab("log"); await api("/api/watchinfo", {host: $("#host").value}); };
$("#host").onchange = e => LS.set("host", e.target.value.trim());
async function refreshOwn(){
  const st = await api("/api/state"); S.st = st; S.faces = st.faces;
  delete S.faceCache[S.proj.name];
  renderProjects(); renderFaces();
}

(() => { const r = $("#resz"), b = $("#bottom"); let y0, h0;
  const h = LS.get("bottomH", 0); if (h) b.style.height = h + "px";
  r.onmousedown = e => { y0 = e.clientY; h0 = b.offsetHeight; document.onmousemove = ev => { b.style.height = Math.max(120, h0 - (ev.clientY - y0)) + "px"; };
    document.onmouseup = () => { document.onmousemove = null; LS.set("bottomH", b.offsetHeight); }; }; })();

init().catch(e => { document.body.innerHTML = "<p style='padding:20px'>" + esc(T("Error on start: ")) + esc(e.message) + "</p>"; });
pollLog();
</script>
</body>
</html>
